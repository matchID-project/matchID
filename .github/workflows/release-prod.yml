name: Release Prod

run-name: Release prod ${{ inputs.release_kind }} ${{ inputs.final_prod_tag || inputs.snapshot_name || inputs.app_ref || 'main' }}

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: Prod release kind
        required: true
        default: app_and_data
        type: choice
        options:
          - app_and_data
          - data_only
          - rollback
      app_ref:
        description: Git ref for the application/runtime code
        required: false
        default: main
        type: string
      final_prod_tag:
        description: Optional final prod tag; leave empty to allocate vYYYY.MM.DD.N
        required: false
        type: string
      snapshot_name:
        description: Existing Elasticsearch snapshot for data_only/rollback, or optional app_and_data reuse
        required: false
        type: string
      dataprep_version:
        description: Optional dataprep version metadata when snapshot_name is provided
        required: false
        type: string
      data_version:
        description: Optional data version metadata when snapshot_name is provided
        required: false
        type: string
      force_restore:
        description: Force alias switch to the requested snapshot
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: prod-release
  cancel-in-progress: false

jobs:
  release-context:
    name: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release_kind: ${{ steps.context.outputs.release_kind }}
      app_ref: ${{ steps.context.outputs.app_ref }}
      app_sha: ${{ steps.context.outputs.app_sha }}
      final_prod_tag: ${{ steps.context.outputs.final_prod_tag }}
      should_run_full: ${{ steps.context.outputs.should_run_full }}
      snapshot_name: ${{ steps.context.outputs.snapshot_name }}
      dataprep_version: ${{ steps.context.outputs.dataprep_version }}
      data_version: ${{ steps.context.outputs.data_version }}
      force_restore: ${{ steps.context.outputs.force_restore }}
      deces_ui_image_version: ${{ steps.images.outputs.deces_ui_image_version }}
      deces_backend_image_version: ${{ steps.images.outputs.deces_backend_image_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.app_ref || 'main' }}

      - name: Resolve prod release context
        id: context
        env:
          INPUT_APP_REF: ${{ inputs.app_ref || 'main' }}
          INPUT_DATA_VERSION: ${{ inputs.data_version }}
          INPUT_DATAPREP_VERSION: ${{ inputs.dataprep_version }}
          INPUT_FINAL_PROD_TAG: ${{ inputs.final_prod_tag }}
          INPUT_FORCE_RESTORE: ${{ inputs.force_restore || 'false' }}
          INPUT_RELEASE_KIND: ${{ inputs.release_kind }}
          INPUT_SNAPSHOT_NAME: ${{ inputs.snapshot_name }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin main

          RELEASE_KIND="${INPUT_RELEASE_KIND:-app_and_data}"
          APP_REF="${INPUT_APP_REF:-main}"
          SNAPSHOT_NAME="${INPUT_SNAPSHOT_NAME:-}"
          DATAPREP_VERSION="${INPUT_DATAPREP_VERSION:-}"
          DATA_VERSION="${INPUT_DATA_VERSION:-}"
          FORCE_RESTORE="${INPUT_FORCE_RESTORE:-false}"

          case "$RELEASE_KIND" in
            app_and_data|data_only|rollback) ;;
            *)
              echo "release_kind must be one of app_and_data, data_only, rollback" >&2
              exit 1
              ;;
          esac
          case "$FORCE_RESTORE" in
            true|false) ;;
            *)
              echo "force_restore must be true or false" >&2
              exit 1
              ;;
          esac

          SHOULD_RUN_FULL=false
          if [ "$RELEASE_KIND" = "app_and_data" ] && [ -z "$SNAPSHOT_NAME" ]; then
            SHOULD_RUN_FULL=true
            FORCE_RESTORE=true
          fi
          if [ "$RELEASE_KIND" = "rollback" ]; then
            FORCE_RESTORE=true
          fi
          if [ "$RELEASE_KIND" != "app_and_data" ] && [ -z "$SNAPSHOT_NAME" ]; then
            echo "snapshot_name is required for $RELEASE_KIND" >&2
            exit 1
          fi

          FINAL_PROD_TAG="${INPUT_FINAL_PROD_TAG:-}"
          if [ -z "$FINAL_PROD_TAG" ]; then
            today="$(date -u +v%Y.%m.%d)"
            escaped_today="$(printf '%s' "$today" | sed 's/\./\\./g')"
            latest_n="$(
              git tag --list "${today}.*" |
                sed -n "s/^${escaped_today}\.\([0-9][0-9]*\)$/\1/p" |
                sort -n |
                tail -n 1
            )"
            next_n=$(( ${latest_n:-0} + 1 ))
            FINAL_PROD_TAG="${today}.${next_n}"
          fi

          if ! [[ "$FINAL_PROD_TAG" =~ ^v[0-9][0-9][0-9][0-9]\.[0-9][0-9]\.[0-9][0-9]\.[0-9]+$ ]]; then
            echo "prod tag must match vYYYY.MM.DD.N (v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].N)" >&2
            exit 1
          fi
          if [ "$FINAL_PROD_TAG" = "v0" ]; then
            echo "v0 is a legacy tag and is not a valid prod publication tag" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${FINAL_PROD_TAG}" >/dev/null; then
            echo "final prod tag already exists: ${FINAL_PROD_TAG}" >&2
            exit 1
          fi

          APP_SHA="$(git rev-parse HEAD)"
          {
            echo "release_kind=${RELEASE_KIND}"
            echo "app_ref=${APP_REF}"
            echo "app_sha=${APP_SHA}"
            echo "final_prod_tag=${FINAL_PROD_TAG}"
            echo "should_run_full=${SHOULD_RUN_FULL}"
            echo "snapshot_name=${SNAPSHOT_NAME}"
            echo "dataprep_version=${DATAPREP_VERSION}"
            echo "data_version=${DATA_VERSION}"
            echo "force_restore=${FORCE_RESTORE}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve deploy image versions
        id: images
        run: |
          set -euo pipefail
          {
            echo "deces_ui_image_version=$(make artifact-version-deces-ui GIT_BRANCH=master | tail -1)"
            echo "deces_backend_image_version=$(make artifact-version-deces-backend GIT_BRANCH=master | tail -1)"
          } >> "$GITHUB_OUTPUT"

  ensure-matchid-backend-image-prod:
    name: ensure-matchid-backend-image-prod
    needs: release-context
    if: needs.release-context.outputs.should_run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_version: ${{ steps.resolve.outputs.image_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.app_ref }}

      - name: Resolve matchid-backend prod image
        id: resolve
        run: |
          set -euo pipefail
          echo "image_version=$(make artifact-version-dataprep-backend GIT_BRANCH=master | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Validate matchid-backend prod image availability
        run: make -C packages/dataprep-backend backend-docker-check GIT_BRANCH=master APP_VERSION="${APP_VERSION}"
        env:
          APP_VERSION: ${{ steps.resolve.outputs.image_version }}

  ensure-prod-snapshot:
    name: ensure-prod-snapshot
    needs:
      - release-context
      - ensure-matchid-backend-image-prod
    if: always() && needs.release-context.result == 'success' && (needs.ensure-matchid-backend-image-prod.result == 'success' || needs.ensure-matchid-backend-image-prod.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      APP_DNS: deces.matchid.io
      PROD_REPOSITORY_BUCKET: fichier-des-personnes-decedees-elasticsearch
      DATAPREP_SCW_FLAVOR_PROD: PRO2-L
      DATAPREP_SCW_VOLUME_SIZE_PROD: 50000000000
      DATAPREP_SCW_VOLUME_TYPE_PROD: sbs_volume
      DATAPREP_CHUNK_SIZE_PROD: 75000
      DATAPREP_ES_THREADS_PROD: 30
      DATAPREP_RECIPE_THREADS_PROD: 32
      DATAPREP_RECIPE_QUEUE_PROD: 34
      DATAPREP_ES_MEM_PROD: 62000m
      DATAPREP_FILES_TO_PROCESS_PROD: 'deces-((19[7-9][0-9]|20(0[0-9]|1[0-9]|2[0-4]))|202[56]-m(0[1-9]|1[0-2]))\.txt\.gz'
    outputs:
      snapshot_name: ${{ steps.snapshot.outputs.snapshot_name }}
      dataprep_version: ${{ steps.snapshot.outputs.dataprep_version }}
      data_version: ${{ steps.snapshot.outputs.data_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.app_ref }}

      - name: Install deploy SSH key
        if: needs.release-context.outputs.should_run_full == 'true'
        run: |
          test -n "${SSH_PRIVATE_KEY}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_rsa_matchID"
          chmod 600 "${HOME}/.ssh/id_rsa_matchID"
          ssh-keygen -y -f "${HOME}/.ssh/id_rsa_matchID" > "${HOME}/.ssh/id_rsa_matchID.pub"
          chmod 644 "${HOME}/.ssh/id_rsa_matchID.pub"
          export SSH_AUTH_SOCK=/tmp/ssh_agent.sock
          ssh-agent -a "${SSH_AUTH_SOCK}" > /dev/null
          ssh-add "${HOME}/.ssh/id_rsa_matchID"
          sanitize_host() {
            local value
            value="$(printf '%s' "$1" | tr -d '\r\n[:space:]')"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            value="${value#http://}"
            value="${value#https://}"
            value="${value#ssh://}"
            if [[ "${value}" == *@* ]]; then value="${value##*@}"; fi
            value="${value%%/*}"
            if [[ "${value}" =~ ^\[[^]]+\]:[0-9]+$ ]]; then
              value="${value#\[}"
              value="${value%%\]:*}"
            elif [[ "${value}" =~ ^[^:]+:[0-9]+$ ]]; then
              value="${value%%:*}"
            fi
            printf '%s' "${value}"
          }
          sanitize_user() {
            local value
            value="$(printf '%s' "$1" | tr -d '\r\n[:space:]')"
            value="${value#\"}"
            value="${value%\"}"
            value="${value#\'}"
            value="${value%\'}"
            value="${value#ssh://}"
            if [[ "${value}" == *@* ]]; then value="${value%%@*}"; fi
            printf '%s' "${value}"
          }
          BASTION_HOST_RESOLVED="$(sanitize_host "${NGINX_HOST}")"
          BASTION_USER_RESOLVED=ubuntu
          NGINX_HOST_RESOLVED="$(sanitize_host "${NGINX_HOST}")"
          NGINX_USER_RESOLVED="$(sanitize_user "${NGINX_USER}")"
          if [ -z "${BASTION_HOST_RESOLVED}" ]; then BASTION_HOST_RESOLVED="$(sanitize_host "${BASTION_HOST}")"; fi
          if [ -z "${BASTION_USER_RESOLVED}" ]; then BASTION_USER_RESOLVED="$(sanitize_user "${BASTION_USER}")"; fi
          if [ -z "${NGINX_HOST_RESOLVED}" ]; then NGINX_HOST_RESOLVED="${BASTION_HOST_RESOLVED}"; fi
          if [ -z "${NGINX_USER_RESOLVED}" ]; then NGINX_USER_RESOLVED=ubuntu; fi
          if ! getent hosts "${BASTION_HOST_RESOLVED}" >/dev/null 2>&1; then
            BASTION_HOST_RESOLVED=163.172.185.238
          fi
          NGINX_HOST_RESOLVED="${BASTION_HOST_RESOLVED}"
          NGINX_USER_RESOLVED="${BASTION_USER_RESOLVED}"
          test -n "${BASTION_HOST_RESOLVED}"
          test -n "${BASTION_USER_RESOLVED}"
          test -n "${NGINX_HOST_RESOLVED}"
          test -n "${NGINX_USER_RESOLVED}"
          printf '%s\n' \
            "Host bastion" \
            "  HostName ${BASTION_HOST_RESOLVED}" \
            "  User ${BASTION_USER_RESOLVED}" \
            "  IdentityFile ${HOME}/.ssh/id_rsa_matchID" \
            "  IdentitiesOnly yes" \
            "  StrictHostKeyChecking no" \
            "  UserKnownHostsFile /dev/null" \
            "Host * !bastion" \
            "  ProxyJump bastion" \
            "  StrictHostKeyChecking no" \
            "  UserKnownHostsFile /dev/null" \
            > "${HOME}/.ssh/config"
          {
            echo "BASTION_HOST_RESOLVED=${BASTION_HOST_RESOLVED}"
            echo "BASTION_USER_RESOLVED=${BASTION_USER_RESOLVED}"
            echo "NGINX_HOST_RESOLVED=${NGINX_HOST_RESOLVED}"
            echo "NGINX_USER_RESOLVED=${NGINX_USER_RESOLVED}"
          } >> "${GITHUB_ENV}"
          chmod 600 "${HOME}/.ssh/config"
        env:
          NGINX_HOST: ${{ secrets.NGINX_HOST }}
          NGINX_USER: ${{ secrets.NGINX_USER || 'ubuntu' }}
          BASTION_HOST: ${{ secrets.BASTION_HOST || secrets.NGINX_HOST }}
          BASTION_USER: ${{ secrets.BASTION_USER || 'ubuntu' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check dataprep full snapshot
        if: needs.release-context.outputs.should_run_full == 'true'
        run: make -C packages/deces-dataprep clean full-check GIT_BRANCH=master REPOSITORY_BUCKET="${PROD_REPOSITORY_BUCKET}"
        env:
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}

      - name: Run dataprep full remote-all
        if: needs.release-context.outputs.should_run_full == 'true'
        run: |
          make -C packages/deces-dataprep remote-all \
            GIT_BRANCH=master \
            REPOSITORY_BUCKET="${PROD_REPOSITORY_BUCKET}" \
            SCW_FLAVOR="${DATAPREP_SCW_FLAVOR_PROD}" SCW_VOLUME_SIZE="${DATAPREP_SCW_VOLUME_SIZE_PROD}" SCW_VOLUME_TYPE="${DATAPREP_SCW_VOLUME_TYPE_PROD}" \
            CHUNK_SIZE="${DATAPREP_CHUNK_SIZE_PROD}" ES_THREADS="${DATAPREP_ES_THREADS_PROD}" RECIPE_THREADS="${DATAPREP_RECIPE_THREADS_PROD}" ES_MEM="${DATAPREP_ES_MEM_PROD}" RECIPE_QUEUE="${DATAPREP_RECIPE_QUEUE_PROD}" \
            SLACK_TITLE="deces-dataprep - full" SLACK_WEBHOOK="${SLACK_WEBHOOK}" \
            REMOTE_TOOLS_REPOSITORY=matchID REMOTE_TOOLS_BRANCH="${APP_REF}" REMOTE_TOOLS_PATH=matchID/matchID REMOTE_TOOLS_MAKE_PATH=matchID/matchID/packages/tools \
            REMOTE_APP_REPOSITORY=matchID REMOTE_APP_BRANCH="${APP_REF}" REMOTE_APP_PATH=matchID/matchID REMOTE_APP_MAKE_PATH=matchID/matchID/packages/deces-dataprep \
            DATAPREP_BACKEND_MAKEOVERRIDES="APP_VERSION=${DATAPREP_BACKEND_IMAGE_VERSION}" \
            SSHKEY_PRIVATE="${HOME}/.ssh/id_rsa_matchID" \
            CLOUD_SSHOPTS="-J${BASTION_USER_RESOLVED}@${BASTION_HOST_RESOLVED}"
        env:
          APP_REF: ${{ needs.release-context.outputs.app_ref }}
          DATAPREP_BACKEND_IMAGE_VERSION: ${{ needs.ensure-matchid-backend-image-prod.outputs.image_version }}
          remote_http_proxy: ${{ secrets.remote_http_proxy }}
          remote_https_proxy: ${{ secrets.remote_https_proxy }}
          remote_no_proxy: localhost
          SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_SECRET_TOKEN: ${{ secrets.SCW_SECRET_TOKEN }}
          SCW_SERVER_OPTS: ${{ secrets.SCW_SERVER_OPTS }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Capture full prod snapshot metadata
        id: full_snapshot
        if: needs.release-context.outputs.should_run_full == 'true'
        run: |
          set -euo pipefail
          SNAPSHOT_NAME=$(make artifact-version-dataprep-snapshot FILES_TO_PROCESS="${DATAPREP_FILES_TO_PROCESS_PROD}" REPOSITORY_BUCKET="${PROD_REPOSITORY_BUCKET}" | tail -1)
          DATAPREP_VERSION=$(echo "${SNAPSHOT_NAME}" | sed -E 's/^esdata_([^_]+)_.*/\1/')
          DATA_VERSION=$(echo "${SNAPSHOT_NAME}" | sed -E 's/^esdata_[^_]+_([^_]+)$/\1/')
          {
            echo "snapshot_name=${SNAPSHOT_NAME}"
            echo "dataprep_version=${DATAPREP_VERSION}"
            echo "data_version=${DATA_VERSION}"
          } >> "$GITHUB_OUTPUT"
        env:
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}

      - name: Select prod snapshot metadata
        id: snapshot
        run: |
          set -euo pipefail
          if [ "${SHOULD_RUN_FULL}" = "true" ]; then
            SNAPSHOT_NAME="${FULL_SNAPSHOT_NAME}"
            DATAPREP_VERSION="${FULL_DATAPREP_VERSION}"
            DATA_VERSION="${FULL_DATA_VERSION}"
          else
            SNAPSHOT_NAME="${INPUT_SNAPSHOT_NAME}"
            DATAPREP_VERSION="${INPUT_DATAPREP_VERSION}"
            DATA_VERSION="${INPUT_DATA_VERSION}"
          fi

          if [ -z "$SNAPSHOT_NAME" ]; then
            echo "snapshot metadata is empty" >&2
            exit 1
          fi
          if [ -z "$DATAPREP_VERSION" ]; then
            DATAPREP_VERSION=$(echo "$SNAPSHOT_NAME" | sed -E 's/^esdata_([^_]+)_.*/\1/')
          fi
          if [ -z "$DATA_VERSION" ]; then
            DATA_VERSION=$(echo "$SNAPSHOT_NAME" | sed -E 's/^esdata_[^_]+_([^_]+)$/\1/')
          fi
          {
            echo "snapshot_name=${SNAPSHOT_NAME}"
            echo "dataprep_version=${DATAPREP_VERSION}"
            echo "data_version=${DATA_VERSION}"
          } >> "$GITHUB_OUTPUT"
        env:
          SHOULD_RUN_FULL: ${{ needs.release-context.outputs.should_run_full }}
          FULL_SNAPSHOT_NAME: ${{ steps.full_snapshot.outputs.snapshot_name }}
          FULL_DATAPREP_VERSION: ${{ steps.full_snapshot.outputs.dataprep_version }}
          FULL_DATA_VERSION: ${{ steps.full_snapshot.outputs.data_version }}
          INPUT_SNAPSHOT_NAME: ${{ needs.release-context.outputs.snapshot_name }}
          INPUT_DATAPREP_VERSION: ${{ needs.release-context.outputs.dataprep_version }}
          INPUT_DATA_VERSION: ${{ needs.release-context.outputs.data_version }}

  deploy-prod:
    name: deploy-prod
    needs:
      - release-context
      - ensure-prod-snapshot
    if: always() && needs.release-context.result == 'success' && needs.ensure-prod-snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      public_version_json: ${{ steps.smoke_public.outputs.public_version_json }}
      traefik_version_json: ${{ steps.smoke_backend.outputs.traefik_version_json }}
    env:
      APP_DNS: deces.matchid.io
      HOSTNAME: deces.matchid.io
      NAMESPACE: matchid-prod
      OVERLAY: prod
      PROD_REPOSITORY_BUCKET: fichier-des-personnes-decedees-elasticsearch
      KUBE_CONFIG_DATA_PROD: ${{ secrets.KUBE_CONFIG_DATA_PROD }}
      TRAEFIK_LB_IP_PROD: ${{ secrets.TRAEFIK_LB_IP_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.app_ref }}

      - name: Install kubeconfig
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_DATA_PROD:-}" ]; then
            echo "Missing KUBE_CONFIG_DATA_PROD secret" >&2
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA_PROD" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          kubectl version --client=true
          kubectl get ns "$NAMESPACE"

      - name: Apply prod runtime secrets
        if: needs.release-context.outputs.release_kind == 'app_and_data'
        env:
          API_EMAIL: ${{ secrets.API_EMAIL || 'contact@matchid.io' }}
          BACKEND_TOKEN_KEY: ${{ secrets.BACKEND_TOKEN_KEY }}
          BACKEND_TOKEN_PASSWORD: ${{ secrets.BACKEND_TOKEN_PASSWORD }}
          BACKEND_TOKEN_USER: ${{ secrets.BACKEND_TOKEN_USER || 'matchid.project@gmail.com' }}
          DECES_BACKEND_USERDB_JSON: ${{ secrets.DECES_BACKEND_USERDB_JSON }}
          K8S_SMTP_PORT: 2587
          LOG_BUCKET: ${{ secrets.LOG_BUCKET }}
          LOG_STORAGE_ACCESS_KEY: ${{ secrets.TOOLS_STORAGE_ACCESS_KEY }}
          LOG_STORAGE_SECRET_KEY: ${{ secrets.TOOLS_STORAGE_SECRET_KEY }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          PROOFS_BUCKET: ${{ secrets.PROOFS_BUCKET }}
          PROOFS_GIT_BRANCH: main
          PROOFS_STORAGE_ACCESS_KEY: ${{ secrets.TOOLS_STORAGE_ACCESS_KEY }}
          PROOFS_STORAGE_SECRET_KEY: ${{ secrets.TOOLS_STORAGE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_PWD: ${{ secrets.SMTP_PWD }}
          SMTP_TLS_SELFSIGNED: ${{ secrets.SMTP_TLS_SELFSIGNED }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          set -euo pipefail
          make -C deploy/k8s prod-runtime-secrets NAMESPACE="$NAMESPACE"

      - name: Apply prod restore secrets
        env:
          REPOSITORY_BUCKET: fichier-des-personnes-decedees-elasticsearch
          SNAPSHOT_NAME: ${{ needs.ensure-prod-snapshot.outputs.snapshot_name }}
          FORCE_RESTORE: ${{ needs.release-context.outputs.force_restore }}
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
        run: |
          set -euo pipefail
          make -C deploy/k8s prod-restore-secrets NAMESPACE="$NAMESPACE"

      - name: Wait for Docker images
        if: needs.release-context.outputs.release_kind == 'app_and_data'
        env:
          DECES_BACKEND_IMAGE_VERSION: ${{ needs.release-context.outputs.deces_backend_image_version }}
          DECES_UI_IMAGE_VERSION: ${{ needs.release-context.outputs.deces_ui_image_version }}
        run: |
          set -euo pipefail
          for image in "matchid/deces-backend:$DECES_BACKEND_IMAGE_VERSION" "matchid/deces-ui:$DECES_UI_IMAGE_VERSION"; do
            echo "Waiting for $image"
            for attempt in $(seq 1 30); do
              if docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "$image is available"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$image not available after retries" >&2
                exit 1
              fi
              sleep 10
            done
          done

      - name: Render/apply runtime or restore job
        env:
          DECES_BACKEND_IMAGE_VERSION: ${{ needs.release-context.outputs.deces_backend_image_version }}
          DECES_UI_IMAGE_VERSION: ${{ needs.release-context.outputs.deces_ui_image_version }}
          RELEASE_KIND: ${{ needs.release-context.outputs.release_kind }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete job/elasticsearch-restore --ignore-not-found=true
          kubectl -n "$NAMESPACE" wait --for=delete job/elasticsearch-restore --timeout=120s || true
          if [ "$RELEASE_KIND" = "app_and_data" ]; then
            kubectl -n "$NAMESPACE" delete deploy/redis --ignore-not-found=true
            work_dir="$(mktemp -d)"
            cp -R deploy/k8s "$work_dir/k8s"
            overlay_dir="$work_dir/k8s/overlays/$OVERLAY"
            cat >> "$overlay_dir/kustomization.yaml" <<EOF
          images:
            - name: matchid/deces-backend
              newTag: $DECES_BACKEND_IMAGE_VERSION
            - name: matchid/deces-ui
              newTag: $DECES_UI_IMAGE_VERSION
          EOF
            kubectl kustomize "$overlay_dir" >/tmp/matchid-prod-k8s-rendered.yaml
            kubectl apply -f /tmp/matchid-prod-k8s-rendered.yaml
          else
            kubectl -n "$NAMESPACE" apply -f deploy/k8s/overlays/prod/elasticsearch-restore.job.yaml
          fi

      - name: Wait for runtime and restore
        env:
          RELEASE_KIND: ${{ needs.release-context.outputs.release_kind }}
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status statefulset/redis --timeout=10m
          kubectl -n "$NAMESPACE" rollout status statefulset/elasticsearch --timeout=20m
          kubectl -n "$NAMESPACE" wait --for=condition=complete --timeout=90m job/elasticsearch-restore
          kubectl -n "$NAMESPACE" logs job/elasticsearch-restore --tail=200
          if [ "$RELEASE_KIND" = "app_and_data" ]; then
            kubectl -n "$NAMESPACE" wait --for=condition=Available --timeout=10m \
              deploy/deces-backend deploy/deces-ui
            kubectl -n "$NAMESPACE" rollout status ds/matchid-log-forwarder --timeout=5m
          fi

      - name: Smoke Redis
        run: |
          set -euo pipefail
          redis_pod="$(
            kubectl -n "$NAMESPACE" get pods \
              -l app.kubernetes.io/name=redis,app.kubernetes.io/part-of=matchid \
              -o jsonpath='{.items[0].metadata.name}'
          )"
          kubectl -n "$NAMESPACE" exec "$redis_pod" -- redis-cli ping | grep -Fx PONG

      - name: Smoke proofs storage
        if: needs.release-context.outputs.release_kind == 'app_and_data'
        run: |
          set -euo pipefail
          backend_pod="$(
            kubectl -n "$NAMESPACE" get pods \
              -l app.kubernetes.io/name=deces-backend,app.kubernetes.io/part-of=matchid \
              -o jsonpath='{.items[0].metadata.name}'
          )"
          proofs_count="$(
            kubectl -n "$NAMESPACE" exec "$backend_pod" -c deces-backend -- \
              sh -c 'find /data/proofs -type f -name "*.json" 2>/dev/null | wc -l'
          )"
          proofs_count="$(printf '%s' "$proofs_count" | tr -d '[:space:]')"
          echo "proofs_json_count=$proofs_count"
          test "$proofs_count" -gt 0

      - name: Smoke backend via Traefik
        id: smoke_backend
        run: |
          set -euo pipefail
          resolve_traefik_lb() {
            if [ -n "${TRAEFIK_LB_IP_PROD:-}" ]; then
              printf '%s' "$TRAEFIK_LB_IP_PROD"
              return
            fi
            kubectl -n traefik get svc traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null ||
              kubectl -n kube-system get svc traefik -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null ||
              true
          }
          traefik_lb="$(resolve_traefik_lb)"
          if [ -z "$traefik_lb" ]; then
            echo "missing Traefik load balancer IP; set TRAEFIK_LB_IP_PROD for tenant-scoped kubeconfigs" >&2
            exit 1
          fi
          for endpoint in healthcheck readiness version; do
            curl -fsSk -m 20 -H "Host: $HOSTNAME" \
              "https://$traefik_lb/deces/api/v1/$endpoint" >/tmp/prod-smoke-"$endpoint".json
            cat /tmp/prod-smoke-"$endpoint".json
            if [ "$endpoint" = "version" ]; then
              version_json="$(jq -c . </tmp/prod-smoke-"$endpoint".json)"
              echo "traefik_version_json=${version_json}" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Cut over Cloudflare DNS
        if: needs.release-context.outputs.release_kind == 'app_and_data'
        env:
          CDN_DNS_TOKEN: ${{ secrets.CDN_DNS_TOKEN }}
          CDN_TOKEN: ${{ secrets.CDN_TOKEN }}
          CDN_ZONE_ID: ${{ secrets.CDN_ZONE_ID }}
        run: |
          set -euo pipefail
          public_healthcheck_ok() {
            curl -fsS -m 20 "https://${HOSTNAME}/deces/api/v1/healthcheck" >/dev/null 2>&1
          }
          if [ -z "${CDN_DNS_TOKEN:-}" ]; then
            if public_healthcheck_ok; then
              echo "CDN_DNS_TOKEN is missing, but ${HOSTNAME} already serves healthcheck; skipping DNS cutover"
              exit 0
            fi
            echo "Missing CDN_DNS_TOKEN secret with Cloudflare Zone:DNS:Edit + Zone:Read on matchid.io" >&2
            exit 1
          fi
          test -n "${CDN_ZONE_ID:-}"
          test -n "${TRAEFIK_LB_IP_PROD:-}"

          api="https://api.cloudflare.com/client/v4/zones/${CDN_ZONE_ID}"
          records_json="$(
            curl -fsS \
              -H "Authorization: Bearer ${CDN_DNS_TOKEN}" \
              -H "Content-Type: application/json" \
              "${api}/dns_records?name=${HOSTNAME}"
          )"
          if [ "$(printf '%s' "$records_json" | jq -r '.success')" != "true" ]; then
            printf '%s\n' "$records_json" | jq -c '.errors' >&2
            exit 1
          fi

          a_record_id="$(printf '%s' "$records_json" | jq -r '[.result[] | select(.type == "A")][0].id // ""')"
          if [ -n "$a_record_id" ]; then
            mapfile -t delete_record_ids < <(printf '%s' "$records_json" | jq -r --arg keep "$a_record_id" '.result[] | select(.id != $keep) | .id')
          else
            mapfile -t delete_record_ids < <(printf '%s' "$records_json" | jq -r '.result[].id')
          fi
          for record_id in "${delete_record_ids[@]}"; do
            curl -fsS -X DELETE \
              -H "Authorization: Bearer ${CDN_DNS_TOKEN}" \
              -H "Content-Type: application/json" \
              "${api}/dns_records/${record_id}" >/dev/null
          done

          payload="$(jq -n --arg name "$HOSTNAME" --arg content "$TRAEFIK_LB_IP_PROD" \
            '{type: "A", name: $name, content: $content, ttl: 1, proxied: false}')"
          if [ -n "$a_record_id" ]; then
            dns_response="$(
              curl -fsS -X PUT \
                -H "Authorization: Bearer ${CDN_DNS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "${api}/dns_records/${a_record_id}"
            )"
          else
            dns_response="$(
              curl -fsS -X POST \
                -H "Authorization: Bearer ${CDN_DNS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "${api}/dns_records"
            )"
          fi
          if [ "$(printf '%s' "$dns_response" | jq -r '.success')" != "true" ]; then
            printf '%s\n' "$dns_response" | jq -c '.errors' >&2
            exit 1
          fi

          purge_token="${CDN_TOKEN:-$CDN_DNS_TOKEN}"
          purge_response="$(
            jq -n --arg host "$HOSTNAME" '{hosts: [$host]}' |
              curl -fsS -X POST \
                -H "Authorization: Bearer ${purge_token}" \
                -H "Content-Type: application/json" \
                --data @- \
                "${api}/purge_cache"
          )"
          if [ "$(printf '%s' "$purge_response" | jq -r '.success')" != "true" ]; then
            printf '%s\n' "$purge_response" | jq -c '.errors' >&2
            exit 1
          fi

      - name: Wait for prod certificate
        if: needs.release-context.outputs.release_kind == 'app_and_data'
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" wait --for=condition=Ready --timeout=10m certificate/matchid-prod-tls

      - name: Smoke public endpoints
        id: smoke_public
        run: |
          set -euo pipefail
          for endpoint in healthcheck readiness version; do
            for attempt in $(seq 1 30); do
              if curl -fsS -m 20 "https://$HOSTNAME/deces/api/v1/$endpoint" >/tmp/public-prod-smoke-"$endpoint".json; then
                cat /tmp/public-prod-smoke-"$endpoint".json
                if [ "$endpoint" = "version" ]; then
                  version_json="$(jq -c . </tmp/public-prod-smoke-"$endpoint".json)"
                  echo "public_version_json=${version_json}" >> "$GITHUB_OUTPUT"
                fi
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                curl -fsS -m 20 "https://$HOSTNAME/deces/api/v1/$endpoint"
              fi
              sleep 10
            done
          done

      - name: Verify prod log sinks
        if: needs.release-context.outputs.release_kind == 'app_and_data'
        env:
          LOG_BUCKET: ${{ secrets.LOG_BUCKET }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          TOOLS_STORAGE_ACCESS_KEY: ${{ secrets.TOOLS_STORAGE_ACCESS_KEY }}
          TOOLS_STORAGE_SECRET_KEY: ${{ secrets.TOOLS_STORAGE_SECRET_KEY }}
        run: |
          set -euo pipefail
          sleep 45
          bucket="${LOG_BUCKET%%/*}"
          prefix_base="${LOG_BUCKET#*/}"
          if [ "$prefix_base" = "$LOG_BUCKET" ]; then
            prefix_base=""
          fi
          prefix="${prefix_base:+$prefix_base/}k8s/$NAMESPACE/$(date -u +%Y%m%d)/"
          s3_json="$(
            AWS_CONFIG_FILE=/dev/null \
            AWS_ACCESS_KEY_ID="$TOOLS_STORAGE_ACCESS_KEY" \
            AWS_SECRET_ACCESS_KEY="$TOOLS_STORAGE_SECRET_KEY" \
            aws --endpoint-url https://s3.fr-par.scw.cloud s3api list-objects-v2 \
              --bucket "$bucket" \
              --prefix "$prefix" \
              --max-keys 1 \
              --output json
          )"
          s3_count="$(printf '%s' "$s3_json" | jq '.Contents // [] | length')"
          if [ "$s3_count" -lt 1 ]; then
            echo "no prod K8s log object found in s3://$bucket/$prefix" >&2
            exit 1
          fi

          nrql="SELECT count(*) FROM Log WHERE \`service.name\` = 'deces-matchid-prod' AND \`k8s.namespace.name\` = 'matchid-prod' SINCE 10 minutes AGO"
          payload="$(jq -n --arg account "$NEW_RELIC_ACCOUNT_ID" --arg nrql "$nrql" \
            '{query: "query($account: Int!, $nrql: Nrql!) { actor { account(id: $account) { nrql(query: $nrql) { results } } } }", variables: {account: ($account|tonumber), nrql: $nrql}}')"
          nr_count="$(
            curl -fsS https://api.eu.newrelic.com/graphql \
              -H "API-Key: $NEW_RELIC_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$payload" | jq -r '.data.actor.account.nrql.results[0].count // 0'
          )"
          if [ "$nr_count" -lt 1 ]; then
            echo "no prod K8s log found in New Relic" >&2
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure() || cancelled()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -100 || true
          kubectl -n "$NAMESPACE" describe pods | tail -200 || true
          kubectl -n "$NAMESPACE" logs job/elasticsearch-restore --tail=200 || true
          kubectl -n "$NAMESPACE" logs ds/matchid-log-forwarder --tail=200 || true
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/part-of=matchid --all-containers=true --tail=300 || true

  publish-release-prod-metadata:
    name: publish-release-prod-metadata
    needs:
      - release-context
      - ensure-prod-snapshot
      - deploy-prod
    if: always() && needs.release-context.result == 'success' && needs.ensure-prod-snapshot.result == 'success' && needs.deploy-prod.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-context.outputs.app_ref }}

      - name: Write release metadata artifact
        env:
          APP_REF: ${{ needs.release-context.outputs.app_ref }}
          APP_SHA: ${{ needs.release-context.outputs.app_sha }}
          DATA_VERSION: ${{ needs.ensure-prod-snapshot.outputs.data_version }}
          DATAPREP_VERSION: ${{ needs.ensure-prod-snapshot.outputs.dataprep_version }}
          FINAL_PROD_TAG: ${{ needs.release-context.outputs.final_prod_tag }}
          FORCE_RESTORE: ${{ needs.release-context.outputs.force_restore }}
          PUBLIC_VERSION_JSON: ${{ needs.deploy-prod.outputs.public_version_json }}
          RELEASE_KIND: ${{ needs.release-context.outputs.release_kind }}
          SNAPSHOT_NAME: ${{ needs.ensure-prod-snapshot.outputs.snapshot_name }}
          TRAEFIK_VERSION_JSON: ${{ needs.deploy-prod.outputs.traefik_version_json }}
        run: |
          set -euo pipefail
          cat <<EOF > /tmp/release-prod-metadata.txt
          prod_tag=${FINAL_PROD_TAG}
          release_kind=${RELEASE_KIND}
          app_ref=${APP_REF}
          commit_sha=${APP_SHA}
          snapshot_name=${SNAPSHOT_NAME}
          dataprep_version=${DATAPREP_VERSION}
          data_version=${DATA_VERSION}
          traefik_version_json=${TRAEFIK_VERSION_JSON}
          public_version_json=${PUBLIC_VERSION_JSON}
          force_restore=${FORCE_RESTORE}
          workflow_run_id=${GITHUB_RUN_ID}
          deces_ui_version=$(make package-version-deces-ui)
          deces_backend_version=$(make package-version-deces-backend)
          dataprep_backend_version=$(make package-version-dataprep-backend)
          dataprep_frontend_version=$(make package-version-dataprep-frontend)
          EOF

      - name: Create final prod tag
        env:
          APP_SHA: ${{ needs.release-context.outputs.app_sha }}
          FINAL_PROD_TAG: ${{ needs.release-context.outputs.final_prod_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${FINAL_PROD_TAG}" >/dev/null; then
            echo "tag already exists: ${FINAL_PROD_TAG}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$FINAL_PROD_TAG" -F /tmp/release-prod-metadata.txt "$APP_SHA"
          git push origin "refs/tags/${FINAL_PROD_TAG}"

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-prod-metadata
          path: /tmp/release-prod-metadata.txt
