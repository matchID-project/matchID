name: surch-eval perf

# Mesure perf corpus reel matchID : Surch vs Elasticsearch 8.6.1, EN CI (jamais
# en local). Modele sur le job deces-backend-build de ci.yml (memes secrets +
# make deploy-dependencies monte ES 8.6.1 + redis + le corpus dev restaure).
# Se declenche au push sur surch-eval (autonome) ou a la main (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      surch_tag:
        description: "Tag image Surch (sha-HEAD ou latest)"
        required: false
        default: "latest"
  push:
    branches:
      - surch-eval
    paths:
      - ".github/workflows/surch-eval-perf.yml"
      - "surch-eval/ci/**"

jobs:
  surch-vs-es-perf:
    name: "Surch vs ES 8.6.1 indexation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FILES_TO_PROCESS: "deces-2020-m01.txt.gz"
      REPOSITORY_BUCKET: "fichier-des-personnes-decedees-elasticsearch-dev"
      ES_MEM: "1024m"
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      SURCH_TAG: ${{ github.event.inputs.surch_tag || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Build backend image"
        run: make -C packages/deces-backend DATA_DIR=data NPM_AUDIT_DRY_RUN=true backend-build-image GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Deploy deps (ES 8.6.1 + redis + corpus dev restaure)"
        run: make -C packages/deces-backend NPM_AUDIT_DRY_RUN=true deploy-dependencies GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Start Surch (compat header)"
        run: |
          NET=$(docker network ls --format '{{.Name}}' | grep -i matchid | head -1 || echo bridge)
          echo "network=$NET"
          docker run -d --name surch-eval --network "$NET" --network-alias surch \
            -e SURCH_PORT=9200 -e SURCH_ELASTIC_PRODUCT_COMPAT=1 \
            ghcr.io/rhanka/surch:${SURCH_TAG}
          for i in $(seq 1 30); do
            docker run --rm --network "$NET" curlimages/curl -s http://surch:9200/ >/dev/null 2>&1 && break || sleep 2
          done

      - name: "Indexation timed (Surch vs ES)"
        run: bash surch-eval/ci/reindex_bench_ci.sh

      - name: "Upload perf report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surch-eval-perf
          path: surch-eval/ci/reports/

      - name: "Stop deps"
        if: always()
        run: |
          docker rm -f surch-eval || true
          make -C packages/deces-backend backend-redis-stop backend-smtp-stop GIT_BRANCH=${GITHUB_REF_NAME} || true
