name: surch-eval perf

# Mesure perf corpus reel matchID : Surch vs Elasticsearch 8.6.1, EN CI.
# DEUX JOBS PARALLELES (matrix engine: es|surch), chacun sur SON runner -> seul
# le moteur teste est resident pendant l'indexation + l'artillery (pas de
# contention CPU entre ES et Surch). Modele sur ci.yml deces-backend-build
# (memes secrets + make deploy-dependencies monte ES + corpus dev restaure).
# Declenche au push sur surch-eval (paths) ou a la main (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      surch_tag:
        description: "Tag image Surch (sha-HEAD ou latest)"
        required: false
        default: "latest"
      es_backup_name:
        description: "Snapshot ES (vide=auto CI ~60k ; esdata_eb84b2eb_74bab91a=full 1.36M)"
        required: false
        default: ""
      workers:
        description: "Probe concurrency (4=default ; 2=match 2-vCPU runner, isolates oversubscription tail)"
        required: false
        default: "4"
      files_to_process:
        description: "Corpus selector restored by dataprep/dependencies"
        required: false
        default: "deaths.txt.gz"
      repository_bucket:
        description: "Snapshot bucket (dev by default; prod for full 28M)"
        required: false
        default: "fichier-des-personnes-decedees-elasticsearch-dev"
      expected_count:
        description: "Fail-closed final doc count gate (1355728 for deaths.txt.gz)"
        required: false
        default: "1355728"
      es_mem:
        description: "Elasticsearch heap for dependency restore"
        required: false
        default: "1024m"
      runner_label:
        description: "Runner label; full/prod runs must not use ubuntu-latest"
        required: false
        default: "ubuntu-latest"
  push:
    branches:
      - surch-eval
    paths:
      - ".github/workflows/surch-eval-perf.yml"
      - "surch-eval/ci/**"
  # Daily LONG confirmation run (<=1/day): full 1.36M deces corpus, fair
  # concurrency (WORKERS=2), `latest` image — confirms indexation throughput +
  # the full matchID search (engine probe + end-to-end backend artillery) do not
  # regress. Schedule-only overrides set the full corpus below.
  schedule:
    - cron: "0 3 * * *"

jobs:
  perf:
    name: "perf ${{ matrix.engine }}"
    runs-on: ${{ github.event.inputs.runner_label || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [es, surch]
    permissions:
      contents: read
    env:
      FILES_TO_PROCESS: ${{ github.event.inputs.files_to_process || 'deaths.txt.gz' }}
      REPOSITORY_BUCKET: ${{ github.event.inputs.repository_bucket || 'fichier-des-personnes-decedees-elasticsearch-dev' }}
      # Daily scheduled confirmation runs the FULL 1.36M corpus; manual/push keep
      # their input / the small CI corpus.
      EXPECTED_COUNT: ${{ github.event.inputs.expected_count || (github.event_name == 'schedule' && '1355728' || '') }}
      ES_MEM: ${{ github.event.inputs.es_mem || '1024m' }}
      RUNNER_LABEL: ${{ github.event.inputs.runner_label || 'ubuntu-latest' }}
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      SURCH_TAG: ${{ github.event.inputs.surch_tag || 'latest' }}
      ES_BACKUP_NAME: ${{ github.event.inputs.es_backup_name || (github.event_name == 'schedule' && 'esdata_eb84b2eb_74bab91a' || '') }}
      PROBE_WORKERS: ${{ github.event.inputs.workers || (github.event_name == 'schedule' && '2' || '4') }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - name: "Preflight F6 inputs"
        run: |
          set -euo pipefail
          echo "files_to_process=${FILES_TO_PROCESS}"
          echo "repository_bucket=${REPOSITORY_BUCKET}"
          echo "expected_count=${EXPECTED_COUNT:-<none>}"
          echo "es_mem=${ES_MEM}"
          echo "runner_label=${RUNNER_LABEL}"
          if [ -n "${EXPECTED_COUNT}" ]; then
            case "$EXPECTED_COUNT" in
              *[!0-9]*) echo "::error::expected_count must be a non-negative integer"; exit 2 ;;
            esac
          fi
          if [ "$REPOSITORY_BUCKET" = "fichier-des-personnes-decedees-elasticsearch" ] || [ "$FILES_TO_PROCESS" != "deaths.txt.gz" ]; then
            test -n "${EXPECTED_COUNT}" || { echo "::error::full/prod surch-eval requires expected_count"; exit 2; }
            test "$RUNNER_LABEL" != "ubuntu-latest" || { echo "::error::full/prod surch-eval must run on a non-default runner or remote-capable label"; exit 2; }
          fi

      - name: "Seed empty wikidata.json (skip flaky Wikidata SPARQL fetch)"
        run: |
          # backend-build-image depends on data/wikidata.json (a Makefile file target
          # that fetches query.wikidata.org via SPARQL — flaky, fails the whole run
          # before any measurement). Pre-seeding [] makes Make see the file as present
          # and skip the fetch. Empty wikidata is harmless for the deces search-latency
          # bench (no entity enrichment is exercised). DATA_DIR=data + make -C
          # packages/deces-backend => packages/deces-backend/data/wikidata.json.
          mkdir -p packages/deces-backend/data
          [ -f packages/deces-backend/data/wikidata.json ] || echo '[]' > packages/deces-backend/data/wikidata.json

      - name: "Build backend image"
        run: make -C packages/deces-backend DATA_DIR=data NPM_AUDIT_DRY_RUN=true backend-build-image GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Deploy deps (ES 8.6.1 + redis + corpus dev restaure)"
        run: make -C packages/deces-backend NPM_AUDIT_DRY_RUN=true deploy-dependencies GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Resolve network"
        run: |
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' deces-elasticsearch | head -1)
          test -n "$NET"; echo "NET=$NET" >> "$GITHUB_ENV"; echo "network=$NET"

      - name: "Start Surch (compat header)"
        if: matrix.engine == 'surch'
        run: |
          set -e
          docker run -d --name surch-eval --network "$NET" --network-alias surch \
            -e SURCH_PORT=9200 -e SURCH_ELASTIC_PRODUCT_COMPAT=1 ghcr.io/rhanka/surch:${SURCH_TAG}
          for i in $(seq 1 30); do docker run --rm --network "$NET" curlimages/curl -s http://surch:9200/ >/dev/null 2>&1 && break || sleep 2; done

      - name: "Indexation timed (${{ matrix.engine }})"
        run: |
          mkdir -p surch-eval/ci/reports
          if [ "$ENGINE" = "surch" ]; then RSS_CONTAINER=surch-eval; else RSS_CONTAINER=deces-elasticsearch; fi
          bash surch-eval/ci/rss_container.sh "$ENGINE" "$RSS_CONTAINER" "surch-eval/ci/reports/rss-${ENGINE}.json" &
          RSS_PID=$!
          set +e
          docker run --rm --network "$NET" -v "$PWD/surch-eval/ci:/ci" -w /ci \
            -e ENGINE=${ENGINE} -e ES_URL=http://elasticsearch:9200 -e SURCH_URL=http://surch:9200 -e OUT_DIR=/ci/reports \
            -e EXPECTED_COUNT="${EXPECTED_COUNT}" \
            alpine:3.20 sh -c 'apk add --no-cache bash curl jq bc coreutils >/dev/null && bash /ci/index_engine.sh'
          RC=$?
          kill "$RSS_PID" >/dev/null 2>&1 || true
          wait "$RSS_PID" >/dev/null 2>&1 || true
          set -e
          cat surch-eval/ci/reports/indexation-${ENGINE}.json
          cat surch-eval/ci/reports/rss-${ENGINE}.json
          jq -e '.samples > 0 and .peak_mib > 0' "surch-eval/ci/reports/rss-${ENGINE}.json"
          test "$RC" -eq 0
          jq -e '.verdict == "pass"' "surch-eval/ci/reports/indexation-${ENGINE}.json"

      - name: "Disk size (${{ matrix.engine }})"
        run: |
          # #19 axe disque master plan : taille brute du segment in-engine
          # APRÈS indexation + refresh (l'index est read-mostly à ce moment).
          # `du -sb` côté Surch (TMPDIR contient le segment source on-disk).
          # `_cat/indices?bytes=b` côté ES pour le store size.
          mkdir -p surch-eval/ci/reports
          if [ "$ENGINE" = "surch" ]; then
            SURCH_DATA=$(docker exec surch-eval sh -c 'ls -d /tmp/surch-source-* 2>/dev/null | head -1' || true)
            if [ -n "$SURCH_DATA" ]; then
              BYTES=$(docker exec surch-eval du -sb "$SURCH_DATA" | awk '{print $1}')
            else
              BYTES=0
            fi
            jq -n --argjson b "${BYTES:-0}" '{engine:"surch",disk_bytes:$b,disk_mib:($b/1048576)}' \
              | tee surch-eval/ci/reports/disk-surch.json
          else
            BYTES=$(docker run --rm --network "$NET" curlimages/curl:8.10.1 -s "http://elasticsearch:9200/_cat/indices/deces_bench?bytes=b&h=ss" | awk '{print $1}' | head -1)
            jq -n --argjson b "${BYTES:-0}" '{engine:"es",disk_bytes:$b,disk_mib:($b/1048576)}' \
              | tee surch-eval/ci/reports/disk-es.json
          fi

      - name: "Latency probe engine-to-engine (${{ matrix.engine }})"
        run: |
          # Clean engine-to-engine deces latency: replay the real deces-backend
          # query shape directly against the engine's _search (NO Node backend,
          # which confounds the artillery numbers). es -> the restored snapshot
          # at elasticsearch:9200; surch -> the index just loaded at surch:9200.
          if [ "$ENGINE" = "surch" ]; then EURL=http://surch:9200; else EURL=http://elasticsearch:9200; fi
          docker run --rm --network "$NET" \
            -v "$PWD/surch-eval/ci:/ci" \
            -v "$PWD/packages/deces-backend/tests:/names:ro" -w /ci \
            -e ENGINE=${ENGINE} -e ENGINE_URL="$EURL" -e ES_INDEX=deces \
            -e NAMES=/names/clients_test.csv -e OUT_DIR=/ci/reports \
            -e REQUESTS=2000 -e WORKERS=${PROBE_WORKERS} \
            alpine:3.20 sh -c 'apk add --no-cache bash curl coreutils >/dev/null && bash /ci/latency_engine.sh'
          cat surch-eval/ci/reports/latency-${ENGINE}.json
          jq -e '.errors == 0' "surch-eval/ci/reports/latency-${ENGINE}.json"

      - name: "Latency decompose (${{ matrix.engine }})"
        run: |
          if [ "$ENGINE" = "surch" ]; then EURL=http://surch:9200; else EURL=http://elasticsearch:9200; fi
          docker run --rm --network "$NET" \
            -v "$PWD/surch-eval/ci:/ci" \
            -v "$PWD/packages/deces-backend/tests:/names:ro" -w /ci \
            -e ENGINE=${ENGINE} -e ENGINE_URL="$EURL" -e ES_INDEX=deces \
            -e NAMES=/names/clients_test.csv -e OUT_DIR=/ci/reports \
            -e REQUESTS=1500 -e WORKERS=${PROBE_WORKERS} \
            alpine:3.20 sh -c 'apk add --no-cache bash curl coreutils >/dev/null && bash /ci/latency_decompose.sh'
          cat surch-eval/ci/reports/decompose-${ENGINE}.json
          jq -e '(.match.errors // 0) == 0 and (.bool.errors // 0) == 0 and (.full.errors // 0) == 0' "surch-eval/ci/reports/decompose-${ENGINE}.json"

      - name: "Scrape Surch fused-path instrumentation (#20)"
        if: matrix.engine == 'surch'
        run: |
          # After the probes populated the histograms, dump Surch's per-stage
          # quantiles (recall+score / finalize / hydrate) + the intersection
          # size, to locate the bool/full ~10ms tail. Surch is still up here.
          docker run --rm --network "$NET" curlimages/curl:8.10.1 -s \
            http://surch:9200/_prometheus_metrics \
            | grep -E 'surch_bool_|surch_dbg_|surch_search_duration|surch_index_|surch_state_|surch_process_|surch_jemalloc_' > surch-eval/ci/reports/fused-metrics-surch.txt || true
          echo "=== surch_bool_* (stage quantiles us / candidates) ==="
          cat surch-eval/ci/reports/fused-metrics-surch.txt || echo "(no surch_bool_ metrics scraped)"

      - name: "Point backend at Surch (stop ES, Surch->elasticsearch alias)"
        if: matrix.engine == 'surch'
        run: |
          docker network disconnect "$NET" deces-elasticsearch || true
          docker stop deces-elasticsearch || true
          docker network disconnect "$NET" surch-eval
          docker network connect --alias elasticsearch --alias surch "$NET" surch-eval

      - name: "Start deces-backend (alias backend)"
        run: |
          set -e
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i 'deces-backend' | grep -v '<none>' | head -1)
          docker run -d --name backend --network "$NET" --network-alias backend \
            -e NODE_ENV=development -e BACKEND_PORT=8080 -e ES_INDEX=deces -e APP=deces -e APP_VERSION=latest \
            -e COMMUNES_JSON=data/communes.json -e DISPOSABLE_MAIL=data/disposable-mail.txt \
            -e DB_JSON=data/userDB.json -e PROOFS=data/proofs -e JOBS=data/jobs -e WIKIDATA_LINKS=data/wikidata.json \
            -e BACKEND_JOB_CONCURRENCY=6 -e BACKEND_CHUNK_CONCURRENCY=3 -e BACKEND_TMP_MAX=10000000 \
            -e BACKEND_TMP_DURATION=14400 -e BACKEND_TMP_WINDOW=86400 -e BACKEND_TMPFILE_PERSISTENCE=3600000 \
            -e BACKEND_LOG_LEVEL=error -e BACKEND_TOKEN_KEY=devkey -e BACKEND_TOKEN_USER=dev -e BACKEND_TOKEN_PASSWORD=dev \
            "$IMG"
          for i in $(seq 1 40); do docker run --rm --network "$NET" curlimages/curl -s http://backend:8080/deces/api/v1/version >/dev/null 2>&1 && break || sleep 2; done

      - name: "Upload report (pre-artillery checkpoint)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surch-eval-perf-${{ matrix.engine }}-precheck
          path: surch-eval/ci/reports/

      - name: "Artillery ${{ matrix.engine }}"
        run: |
          make -C packages/deces-backend test-perf-v1 DC_NETWORK="$NET" || true
          mkdir -p surch-eval/ci/reports/art
          cp -r packages/deces-backend/tests/performance/reports/* surch-eval/ci/reports/art/ 2>/dev/null || true

      - name: "Write summary"
        if: always()
        run: |
          ENGINE=${ENGINE} \
          OUT_DIR=surch-eval/ci/reports \
          FILES_TO_PROCESS="${FILES_TO_PROCESS}" \
          REPOSITORY_BUCKET="${REPOSITORY_BUCKET}" \
          ES_BACKUP_NAME="${ES_BACKUP_NAME}" \
          EXPECTED_COUNT="${EXPECTED_COUNT}" \
          RUNNER_LABEL="${RUNNER_LABEL}" \
          PROBE_WORKERS="${PROBE_WORKERS}" \
          bash surch-eval/ci/write_summary.sh
          cat "surch-eval/ci/reports/summary-${ENGINE}.md"

      - name: "Upload report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surch-eval-perf-${{ matrix.engine }}
          path: surch-eval/ci/reports/

      - name: "Stop deps"
        if: always()
        run: |
          docker rm -f backend surch-eval || true
          make -C packages/deces-backend backend-redis-stop backend-smtp-stop GIT_BRANCH=${GITHUB_REF_NAME} || true
