name: surch-eval perf

# Mesure perf corpus reel matchID : Surch vs Elasticsearch 8.6.1, EN CI (jamais
# en local). Modele sur le job deces-backend-build de ci.yml (memes secrets +
# make deploy-dependencies monte ES 8.6.1 + redis + le corpus dev restaure).
# Se declenche au push sur surch-eval (autonome) ou a la main (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      surch_tag:
        description: "Tag image Surch (sha-HEAD ou latest)"
        required: false
        default: "latest"
      es_backup_name:
        description: "Snapshot ES a restaurer (vide=auto CI ~60k ; esdata_eb84b2eb_74bab91a=full 1.36M)"
        required: false
        default: ""
  push:
    branches:
      - surch-eval
    paths:
      - ".github/workflows/surch-eval-perf.yml"
      - "surch-eval/ci/**"

jobs:
  surch-vs-es-perf:
    name: "Surch vs ES 8.6.1 indexation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FILES_TO_PROCESS: "deces-2020-m01.txt.gz"
      REPOSITORY_BUCKET: "fichier-des-personnes-decedees-elasticsearch-dev"
      ES_MEM: "1024m"
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      SURCH_TAG: ${{ github.event.inputs.surch_tag || 'latest' }}
      ES_BACKUP_NAME: ${{ github.event.inputs.es_backup_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Build backend image"
        run: make -C packages/deces-backend DATA_DIR=data NPM_AUDIT_DRY_RUN=true backend-build-image GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Deploy deps (ES 8.6.1 + redis + corpus dev restaure)"
        run: make -C packages/deces-backend NPM_AUDIT_DRY_RUN=true deploy-dependencies GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Start Surch (compat header)"
        run: |
          set -e
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' deces-elasticsearch | head -1)
          echo "network=$NET"
          test -n "$NET"
          echo "NET=$NET" >> "$GITHUB_ENV"
          docker run -d --name surch-eval --network "$NET" --network-alias surch \
            -e SURCH_PORT=9200 -e SURCH_ELASTIC_PRODUCT_COMPAT=1 \
            ghcr.io/rhanka/surch:${SURCH_TAG}
          ok=""
          for i in $(seq 1 30); do
            if docker run --rm --network "$NET" curlimages/curl -s http://surch:9200/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { echo "Surch unreachable"; docker logs surch-eval | tail -20; exit 1; }
          docker run --rm --network "$NET" curlimages/curl -s -D - -o /dev/null http://surch:9200/ | grep -i x-elastic-product || true

      - name: "Indexation timed (Surch vs ES)"
        run: |
          docker run --rm --network "$NET" \
            -v "$PWD/surch-eval/ci:/ci" -w /ci \
            -e ES_URL=http://elasticsearch:9200 -e SURCH_URL=http://surch:9200 \
            -e ES_INDEX=deces -e OUT_DIR=/ci/reports \
            alpine:3.20 sh -c 'apk add --no-cache bash curl jq bc coreutils >/dev/null && bash /ci/reindex_bench_ci.sh'
          echo "=== indexation.json ==="; cat surch-eval/ci/reports/indexation.json

      - name: "Start deces-backend (alias backend) on the net"
        run: |
          set -e
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i 'deces-backend' | grep -v '<none>' | head -1)
          echo "backend image=$IMG"
          docker run -d --name backend --network "$NET" --network-alias backend \
            -e NODE_ENV=development -e BACKEND_PORT=8080 -e ES_INDEX=deces -e APP=deces -e APP_VERSION=latest \
            -e COMMUNES_JSON=data/communes.json -e DISPOSABLE_MAIL=data/disposable-mail.txt \
            -e DB_JSON=data/userDB.json -e PROOFS=data/proofs -e JOBS=data/jobs -e WIKIDATA_LINKS=data/wikidata.json \
            -e BACKEND_JOB_CONCURRENCY=6 -e BACKEND_CHUNK_CONCURRENCY=3 -e BACKEND_TMP_MAX=10000000 \
            -e BACKEND_TMP_DURATION=14400 -e BACKEND_TMP_WINDOW=86400 -e BACKEND_TMPFILE_PERSISTENCE=3600000 \
            -e BACKEND_LOG_LEVEL=error -e BACKEND_TOKEN_KEY=devkey -e BACKEND_TOKEN_USER=dev -e BACKEND_TOKEN_PASSWORD=dev \
            "$IMG"
          for i in $(seq 1 40); do
            docker run --rm --network "$NET" curlimages/curl -s http://backend:8080/deces/api/v1/version >/dev/null 2>&1 && break || sleep 2
          done

      - name: "Artillery vs ES 8.6.1"
        run: |
          make -C packages/deces-backend test-perf-v1 DC_NETWORK="$NET" || true
          mkdir -p surch-eval/ci/reports/art-es
          cp -r packages/deces-backend/tests/performance/reports/* surch-eval/ci/reports/art-es/ 2>/dev/null || true

      - name: "Artillery vs Surch (swap alias elasticsearch->Surch)"
        run: |
          docker network disconnect "$NET" deces-elasticsearch || true
          docker network disconnect "$NET" surch-eval
          docker network connect --alias elasticsearch --alias surch "$NET" surch-eval
          docker restart backend
          for i in $(seq 1 40); do
            docker run --rm --network "$NET" curlimages/curl -s http://backend:8080/deces/api/v1/version >/dev/null 2>&1 && break || sleep 2
          done
          make -C packages/deces-backend test-perf-v1 DC_NETWORK="$NET" || true
          mkdir -p surch-eval/ci/reports/art-surch
          cp -r packages/deces-backend/tests/performance/reports/* surch-eval/ci/reports/art-surch/ 2>/dev/null || true

      - name: "Upload perf report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surch-eval-perf
          path: surch-eval/ci/reports/

      - name: "Stop deps"
        if: always()
        run: |
          docker rm -f backend surch-eval || true
          make -C packages/deces-backend backend-redis-stop backend-smtp-stop GIT_BRANCH=${GITHUB_REF_NAME} || true
