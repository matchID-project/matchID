name: surch-eval perf

# Mesure perf corpus reel matchID : Surch vs Elasticsearch 8.6.1, EN CI.
# DEUX JOBS PARALLELES (matrix engine: es|surch), chacun sur SON runner -> seul
# le moteur teste est resident pendant l'indexation + l'artillery (pas de
# contention CPU entre ES et Surch). Modele sur ci.yml deces-backend-build
# (memes secrets + make deploy-dependencies monte ES + corpus dev restaure).
# Declenche au push sur surch-eval (paths) ou a la main (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      surch_tag:
        description: "Tag image Surch (sha-HEAD ou latest)"
        required: false
        default: "latest"
      es_backup_name:
        description: "Snapshot ES (vide=auto CI ~60k ; esdata_eb84b2eb_74bab91a=full 1.36M)"
        required: false
        default: ""
      workers:
        description: "Probe concurrency (4=default ; 2=match 2-vCPU runner, isolates oversubscription tail)"
        required: false
        default: "4"
  push:
    branches:
      - surch-eval
    paths:
      - ".github/workflows/surch-eval-perf.yml"
      - "surch-eval/ci/**"

jobs:
  perf:
    name: "perf ${{ matrix.engine }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [es, surch]
    permissions:
      contents: read
    env:
      FILES_TO_PROCESS: "deaths.txt.gz"
      REPOSITORY_BUCKET: "fichier-des-personnes-decedees-elasticsearch-dev"
      ES_MEM: "1024m"
      STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
      STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
      SURCH_TAG: ${{ github.event.inputs.surch_tag || 'latest' }}
      ES_BACKUP_NAME: ${{ github.event.inputs.es_backup_name || '' }}
      PROBE_WORKERS: ${{ github.event.inputs.workers || '4' }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - name: "Build backend image"
        run: make -C packages/deces-backend DATA_DIR=data NPM_AUDIT_DRY_RUN=true backend-build-image GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Deploy deps (ES 8.6.1 + redis + corpus dev restaure)"
        run: make -C packages/deces-backend NPM_AUDIT_DRY_RUN=true deploy-dependencies GIT_BRANCH=${GITHUB_REF_NAME}

      - name: "Resolve network"
        run: |
          NET=$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}' deces-elasticsearch | head -1)
          test -n "$NET"; echo "NET=$NET" >> "$GITHUB_ENV"; echo "network=$NET"

      - name: "Start Surch (compat header)"
        if: matrix.engine == 'surch'
        run: |
          set -e
          docker run -d --name surch-eval --network "$NET" --network-alias surch \
            -e SURCH_PORT=9200 -e SURCH_ELASTIC_PRODUCT_COMPAT=1 ghcr.io/rhanka/surch:${SURCH_TAG}
          for i in $(seq 1 30); do docker run --rm --network "$NET" curlimages/curl -s http://surch:9200/ >/dev/null 2>&1 && break || sleep 2; done

      - name: "Indexation timed (${{ matrix.engine }})"
        run: |
          docker run --rm --network "$NET" -v "$PWD/surch-eval/ci:/ci" -w /ci \
            -e ENGINE=${ENGINE} -e ES_URL=http://elasticsearch:9200 -e SURCH_URL=http://surch:9200 -e OUT_DIR=/ci/reports \
            alpine:3.20 sh -c 'apk add --no-cache bash curl jq bc coreutils >/dev/null && bash /ci/index_engine.sh'
          cat surch-eval/ci/reports/indexation-${ENGINE}.json

      - name: "Latency probe engine-to-engine (${{ matrix.engine }})"
        run: |
          # Clean engine-to-engine deces latency: replay the real deces-backend
          # query shape directly against the engine's _search (NO Node backend,
          # which confounds the artillery numbers). es -> the restored snapshot
          # at elasticsearch:9200; surch -> the index just loaded at surch:9200.
          if [ "$ENGINE" = "surch" ]; then EURL=http://surch:9200; else EURL=http://elasticsearch:9200; fi
          docker run --rm --network "$NET" \
            -v "$PWD/surch-eval/ci:/ci" \
            -v "$PWD/packages/deces-backend/tests:/names:ro" -w /ci \
            -e ENGINE=${ENGINE} -e ENGINE_URL="$EURL" -e ES_INDEX=deces \
            -e NAMES=/names/clients_test.csv -e OUT_DIR=/ci/reports \
            -e REQUESTS=2000 -e WORKERS=${PROBE_WORKERS} \
            alpine:3.20 sh -c 'apk add --no-cache bash curl coreutils >/dev/null && bash /ci/latency_engine.sh'
          cat surch-eval/ci/reports/latency-${ENGINE}.json

      - name: "Latency decompose (${{ matrix.engine }})"
        run: |
          if [ "$ENGINE" = "surch" ]; then EURL=http://surch:9200; else EURL=http://elasticsearch:9200; fi
          docker run --rm --network "$NET" \
            -v "$PWD/surch-eval/ci:/ci" \
            -v "$PWD/packages/deces-backend/tests:/names:ro" -w /ci \
            -e ENGINE=${ENGINE} -e ENGINE_URL="$EURL" -e ES_INDEX=deces \
            -e NAMES=/names/clients_test.csv -e OUT_DIR=/ci/reports \
            -e REQUESTS=1500 -e WORKERS=${PROBE_WORKERS} \
            alpine:3.20 sh -c 'apk add --no-cache bash curl coreutils >/dev/null && bash /ci/latency_decompose.sh'
          cat surch-eval/ci/reports/decompose-${ENGINE}.json

      - name: "Point backend at Surch (stop ES, Surch->elasticsearch alias)"
        if: matrix.engine == 'surch'
        run: |
          docker network disconnect "$NET" deces-elasticsearch || true
          docker stop deces-elasticsearch || true
          docker network disconnect "$NET" surch-eval
          docker network connect --alias elasticsearch --alias surch "$NET" surch-eval

      - name: "Start deces-backend (alias backend)"
        run: |
          set -e
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i 'deces-backend' | grep -v '<none>' | head -1)
          docker run -d --name backend --network "$NET" --network-alias backend \
            -e NODE_ENV=development -e BACKEND_PORT=8080 -e ES_INDEX=deces -e APP=deces -e APP_VERSION=latest \
            -e COMMUNES_JSON=data/communes.json -e DISPOSABLE_MAIL=data/disposable-mail.txt \
            -e DB_JSON=data/userDB.json -e PROOFS=data/proofs -e JOBS=data/jobs -e WIKIDATA_LINKS=data/wikidata.json \
            -e BACKEND_JOB_CONCURRENCY=6 -e BACKEND_CHUNK_CONCURRENCY=3 -e BACKEND_TMP_MAX=10000000 \
            -e BACKEND_TMP_DURATION=14400 -e BACKEND_TMP_WINDOW=86400 -e BACKEND_TMPFILE_PERSISTENCE=3600000 \
            -e BACKEND_LOG_LEVEL=error -e BACKEND_TOKEN_KEY=devkey -e BACKEND_TOKEN_USER=dev -e BACKEND_TOKEN_PASSWORD=dev \
            "$IMG"
          for i in $(seq 1 40); do docker run --rm --network "$NET" curlimages/curl -s http://backend:8080/deces/api/v1/version >/dev/null 2>&1 && break || sleep 2; done

      - name: "Artillery ${{ matrix.engine }}"
        run: |
          make -C packages/deces-backend test-perf-v1 DC_NETWORK="$NET" || true
          mkdir -p surch-eval/ci/reports/art
          cp -r packages/deces-backend/tests/performance/reports/* surch-eval/ci/reports/art/ 2>/dev/null || true

      - name: "Upload report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surch-eval-perf-${{ matrix.engine }}
          path: surch-eval/ci/reports/

      - name: "Stop deps"
        if: always()
        run: |
          docker rm -f backend surch-eval || true
          make -C packages/deces-backend backend-redis-stop backend-smtp-stop GIT_BRANCH=${GITHUB_REF_NAME} || true
