apiVersion: apps/v1
kind: Deployment
metadata:
  name: deces-backend
  labels:
    app.kubernetes.io/name: deces-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: matchid
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deces-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deces-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: matchid
    spec:
      initContainers:
        # processStream.ts:177,473 do `fs.createWriteStream(${JOBS}/...)`
        # with no mkdir; without these dirs Node throws ENOENT on first
        # bulk submission. search.controller.ts uses mkdir recursive for
        # PROOFS, so this is belt-and-braces.
        - name: mkdir-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/jobs /data/proofs && chmod -R 0777 /data
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: deces-backend
          image: matchid/deces-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: BACKEND_PORT
              value: "8080"
            - name: APP
              value: deces-backend
            - name: APP_DNS
              value: deces.local
            - name: APP_URL
              value: http://deces.local
            - name: ES_URL
              value: http://elasticsearch:9200
            - name: ES_INDEX
              value: deces
            - name: BACKEND_PROXY_PATH
              value: /deces/api/v1
            - name: BACKEND_LOG_LEVEL
              value: info
            - name: BACKEND_LOG_TIMER
              value: "60"
            # BullMQ Worker constructor REJECTS concurrency=undefined with
            # "concurrency must be a finite number greater than 0". Defaults
            # mirror the docker-compose values from packages/deces-backend.
            - name: BACKEND_JOB_CONCURRENCY
              value: "2"
            - name: BACKEND_CHUNK_CONCURRENCY
              value: "2"
            - name: BACKEND_TMPFILE_PERSISTENCE
              value: "3000"
            - name: BACKEND_TMP_DURATION
              value: "3600"
            - name: BACKEND_TMP_MAX
              value: "5"
            - name: BACKEND_TMP_WINDOW
              value: "60"
            # Reference data baked into the image by the deces-backend build
            # (Dockerfile `COPY ${DATA_DIR} ./data` step). Pointing at
            # /dev/null instead silently returns empty arrays at import time
            # but then crashes `/search` enrichment in models/result.ts on
            # the very first hit (TypeError: Cannot read properties of
            # undefined (reading '<wikidata id>')).
            - name: DISPOSABLE_MAIL
              value: /deces-backend/data/disposable-mail.txt
            - name: COMMUNES_JSON
              value: /deces-backend/data/communes.json
            - name: DB_JSON
              value: /deces-backend/data/userDB.json
            - name: WIKIDATA_LINKS
              value: /deces-backend/data/wikidata.json
            # BullMQ Redis broker
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            # Bulk jobs and proofs runtime paths. processStream.ts and
            # search.controller.ts write payloads under these roots; without
            # them Node interpolates `undefined/...` and crashes on first
            # submission. emptyDir is fine for smoke and single-pod dev;
            # M1 swaps in a PVC for persistence.
            - name: JOBS
              value: /data/jobs
            - name: PROOFS
              value: /data/proofs
          envFrom:
            - secretRef:
                name: deces-backend-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          # All k8s probes target the cheap /healthcheck so pod scheduling
          # never depends on ES/Redis. The deps-aware /readiness endpoint
          # is exercised by smoke steps in cd-k8s.yml instead.
          # startupProbe tolerates long Node boot (Tsoa route generation,
          # BullMQ worker init, JSON file loads) before liveness kicks in.
          startupProbe:
            httpGet:
              path: /deces/api/v1/healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /deces/api/v1/healthcheck
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /deces/api/v1/healthcheck
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
