apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-restore
  labels:
    app.kubernetes.io/name: elasticsearch-restore
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: matchid
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-restore
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: matchid
    spec:
      restartPolicy: Never
      nodeSelector:
        k8s.scaleway.com/pool-name: matchid
      containers:
        - name: elasticsearch-restore
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ES_URL
              value: http://elasticsearch:9200
            - name: ES_INDEX
              value: deces
            - name: REPOSITORY_NAME
              value: matchID
            - name: REPOSITORY_BUCKET
              value: fichier-des-personnes-decedees-elasticsearch
            - name: SNAPSHOT_NAME
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-restore-secrets
                  key: SNAPSHOT_NAME
            - name: FORCE_RESTORE
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-restore-secrets
                  key: FORCE_RESTORE
                  optional: true
            - name: RESTORE_MARKER_INDEX
              value: .matchid-restore-state
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-restore-secrets
                  key: STORAGE_ACCESS_KEY
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-restore-secrets
                  key: STORAGE_SECRET_KEY
          command:
            - sh
            - -c
          args:
            - |
              set -eu

              count_from_json() {
                sed -n 's/.*"count"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p'
              }

              snapshot_from_json() {
                sed -n 's/.*"snapshot_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
              }

              marker_snapshot() {
                curl -fsS "$ES_URL/$RESTORE_MARKER_INDEX/_doc/$ES_INDEX" 2>/dev/null |
                  snapshot_from_json || true
              }

              write_marker() {
                updated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                curl -fsS -XPUT "$ES_URL/$RESTORE_MARKER_INDEX/_doc/$ES_INDEX" \
                  -H 'Content-Type: application/json' \
                  -d "{\"snapshot_name\":\"$SNAPSHOT_NAME\",\"updated_at\":\"$updated_at\"}" >/dev/null
              }

              echo "waiting for elasticsearch"
              timeout=600
              until curl -fsS "$ES_URL/_cluster/health?wait_for_status=yellow&timeout=1s" >/dev/null; do
                timeout=$((timeout - 1))
                if [ "$timeout" -le 0 ]; then
                  echo "elasticsearch did not become ready"
                  exit 1
                fi
                sleep 1
              done

              existing_count="$(
                curl -fsS "$ES_URL/$ES_INDEX/_count" 2>/dev/null | count_from_json || true
              )"
              if [ -n "$existing_count" ] && [ "$existing_count" -gt 0 ]; then
                current_snapshot="$(marker_snapshot)"
                if [ "${FORCE_RESTORE:-false}" != "true" ]; then
                  if [ "$current_snapshot" = "$SNAPSHOT_NAME" ]; then
                    echo "index $ES_INDEX already has $existing_count documents from $SNAPSHOT_NAME; skipping restore"
                    exit 0
                  fi
                  if [ -z "$current_snapshot" ]; then
                    echo "index $ES_INDEX already has $existing_count documents with no marker; recording $SNAPSHOT_NAME and skipping restore"
                    write_marker
                    exit 0
                  fi
                  echo "index $ES_INDEX has $existing_count documents from $current_snapshot but requested $SNAPSHOT_NAME"
                  echo "set FORCE_RESTORE=true to replace the index"
                  exit 1
                fi

                echo "FORCE_RESTORE=true; deleting index $ES_INDEX before restoring $SNAPSHOT_NAME"
                curl -fsS -XDELETE "$ES_URL/$ES_INDEX" >/dev/null
              elif [ -n "$existing_count" ]; then
                echo "index $ES_INDEX exists but is empty; deleting it before restoring $SNAPSHOT_NAME"
                curl -fsS -XDELETE "$ES_URL/$ES_INDEX" >/dev/null
              fi

              echo "configuring snapshot repository $REPOSITORY_NAME"
              curl -fsS -XPUT "$ES_URL/_snapshot/$REPOSITORY_NAME" \
                -H 'Content-Type: application/json' \
                -d "{\"type\":\"s3\",\"settings\":{\"bucket\":\"$REPOSITORY_BUCKET\",\"client\":\"default\",\"region\":\"fr-par\",\"endpoint\":\"s3.fr-par.scw.cloud\",\"path_style_access\":true,\"protocol\":\"https\"}}"

              echo "restoring snapshot $SNAPSHOT_NAME"
              curl -fsS -XPOST "$ES_URL/_snapshot/$REPOSITORY_NAME/$SNAPSHOT_NAME/_restore?wait_for_completion=true" \
                -H 'Content-Type: application/json' \
                -d "{\"indices\":\"$ES_INDEX\",\"ignore_unavailable\":true,\"include_global_state\":false}"

              restored_count="$(
                curl -fsS "$ES_URL/$ES_INDEX/_count" | count_from_json
              )"
              if [ -z "$restored_count" ] || [ "$restored_count" -le 0 ]; then
                echo "restore completed but $ES_INDEX count is empty"
                exit 1
              fi
              write_marker
              echo "restored $restored_count documents into $ES_INDEX"
