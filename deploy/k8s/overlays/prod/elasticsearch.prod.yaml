apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  replicas: 1
  template:
    spec:
      nodeSelector:
        k8s.scaleway.com/pool-name: matchid
      initContainers:
        - name: prepare-s3-keystore
          image: docker.elastic.co/elasticsearch/elasticsearch:8.6.1
          command:
            - sh
            - -c
            - |
              set -eu
              cp -R /usr/share/elasticsearch/config/. /elastic-config/
              ES_PATH_CONF=/elastic-config bin/elasticsearch-keystore create
              printf '%s\n' "$STORAGE_ACCESS_KEY" | ES_PATH_CONF=/elastic-config bin/elasticsearch-keystore add --stdin --force s3.client.default.access_key
              printf '%s\n' "$STORAGE_SECRET_KEY" | ES_PATH_CONF=/elastic-config bin/elasticsearch-keystore add --stdin --force s3.client.default.secret_key
          env:
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-s3-secrets
                  key: STORAGE_ACCESS_KEY
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-s3-secrets
                  key: STORAGE_SECRET_KEY
          volumeMounts:
            - name: es-config
              mountPath: /elastic-config
      containers:
        - name: elasticsearch
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms6g -Xmx6g"
          resources:
            requests:
              cpu: 1500m
              memory: 6Gi
            limits:
              cpu: 3500m
              memory: 13Gi
          volumeMounts:
            - name: es-config
              mountPath: /usr/share/elasticsearch/config
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: scw-bssd
        resources:
          requests:
            storage: 80Gi
