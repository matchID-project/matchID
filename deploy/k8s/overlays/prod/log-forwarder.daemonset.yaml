apiVersion: v1
kind: ServiceAccount
metadata:
  name: matchid-log-forwarder
  labels:
    app.kubernetes.io/name: matchid-log-forwarder
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: matchid
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: matchid-log-forwarder
  labels:
    app.kubernetes.io/name: matchid-log-forwarder
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: matchid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: matchid-log-forwarder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matchid-log-forwarder
        app.kubernetes.io/component: logging
        app.kubernetes.io/part-of: matchid
    spec:
      serviceAccountName: matchid-log-forwarder
      nodeSelector:
        k8s.scaleway.com/pool-name: matchid
      tolerations:
        - key: dedicated
          operator: Equal
          value: matchid
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:2.2.3
          imagePullPolicy: IfNotPresent
          args:
            - --config=/fluent-bit/etc/fluent-bit.conf
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOG_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: matchid-log-forwarder-secrets
                  key: LOG_S3_BUCKET
            - name: LOG_S3_PREFIX
              valueFrom:
                secretKeyRef:
                  name: matchid-log-forwarder-secrets
                  key: LOG_S3_PREFIX
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: matchid-log-forwarder-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: matchid-log-forwarder-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: NEW_RELIC_INGEST_KEY
              valueFrom:
                secretKeyRef:
                  name: matchid-log-forwarder-secrets
                  key: NEW_RELIC_INGEST_KEY
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
              readOnly: true
            - name: host-var-log
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /fluent-bit/state
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0
      volumes:
        - name: config
          configMap:
            name: matchid-log-forwarder-config
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: state
          emptyDir: {}
