apiVersion: apps/v1
kind: Deployment
metadata:
  name: deces-backend
spec:
  replicas: 1
  template:
    spec:
      # matchid-test mirrors the prod VM (GP1-XS = 4 vCPU / 16 GiB) on the
      # dedicated `matchid` pool (POP2-4C-16G, 1 node always-on), provisioned
      # by rhanka/k8s-ops `make pool-matchid`.
      nodeSelector:
        k8s.scaleway.com/pool-name: matchid
      tolerations:
        - key: dedicated
          operator: Equal
          value: matchid
          effect: NoSchedule
      containers:
        - name: deces-backend
          env:
            - name: APP_DNS
              value: test.deces.matchid.io
            - name: APP_URL
              value: https://test.deces.matchid.io
          envFrom:
            - secretRef:
                name: deces-backend-secrets
                optional: false
          # NewRelic 7-day baseline on the prod VM shows the Node process at
          # max 75 % of one vCPU and 582 MiB RSS. Limits give comfortable
          # headroom; the base 512 Mi / 1 GiB sizing is enough for steady
          # state but bumps to 1 GiB / 2 GiB here so a slow GC pause under
          # full-corpus load does not OOM.
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
