apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: matchid-test

resources:
  - ../../base

# poc-k8s owns Namespace, ResourceQuota, LimitRange and NetworkPolicies for
# matchid-test. This overlay owns only the application workload resources.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: matchid
    target:
      kind: Namespace
      name: matchid
  - path: elasticsearch.test.yaml
    target:
      kind: StatefulSet
      name: elasticsearch
  - path: redis.test.yaml
    target:
      kind: Deployment
      name: redis
  - path: deces-backend.test.yaml
    target:
      kind: Deployment
      name: deces-backend
  - path: deces-ui.test.yaml
    target:
      kind: Deployment
      name: deces-ui
  - path: ingress.test.yaml
    target:
      kind: Ingress
      name: deces
