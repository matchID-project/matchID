# Dev overlay : public hostname behind cert-manager-issued TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deces
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dev.deces.matchid.io
      secretName: matchid-dev-tls
  rules:
    - host: dev.deces.matchid.io
      http:
        paths:
          - path: /deces/api/v1
            pathType: Prefix
            backend:
              service:
                name: deces-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deces-ui
                port:
                  number: 8083
