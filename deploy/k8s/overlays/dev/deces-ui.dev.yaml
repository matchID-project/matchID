apiVersion: apps/v1
kind: Deployment
metadata:
  name: deces-ui
spec:
  template:
    spec:
      nodeSelector:
        k8s.scaleway.com/pool-name: general
      containers:
        - name: deces-ui
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
