apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  template:
    spec:
      nodeSelector:
        k8s.scaleway.com/pool-name: general
      containers:
        - name: redis
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
